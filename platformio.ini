; ============================================================================
;  espprog - Emulador do programador de mao TRIFLEX CONNECT via Ethernet
;  Alvo: WT32-ETH01 (ESP32-D0WD + LAN8720)
; ============================================================================
[env:wt32-eth01]
platform  = espressif32@6.9.0        ; Arduino core 2.0.17 (ja presente na maquina)
board     = wt32-eth01
framework = arduino

; ---- gravacao / monitor (CP2102 no header J2) ------------------------------
upload_port   = COM8
upload_speed  = 460800
monitor_port  = COM8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DESPPROG_VERSION='"1.1.0"'
    ; RX/TX do barramento PROG (ver mapa de pinos no README)
    -DPIN_PROG_RX=5
    -DPIN_PROG_TX=17
    -DPIN_LED=4
    -DPIN_BUZZER=14
    ; I2C do acelerometro/giroscopio MPU-6050 (GY-521)
    -DPIN_IMU_SDA=32
    -DPIN_IMU_SCL=33
    ; Raiz OID privada. TROQUE pelo seu PEN se tiver um (IANA).
    -DESPPROG_ENTERPRISE=63050

; Se um dia migrar para o Arduino core 3.x, basta trocar a linha platform por:
;   platform = espressif32@^7.0.0
; O codigo ja compila nos dois (ver netmgr.cpp).
